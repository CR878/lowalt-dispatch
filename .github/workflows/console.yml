name: AERIS console and assistant

on:
  push:
    paths: ["apps/console/**", "services/assistant/**", "core/**", "planner/**", "scenarios/**", "requirements.txt", ".github/workflows/console.yml"]
  pull_request:
    paths: ["apps/console/**", "services/assistant/**", "core/**", "planner/**", "scenarios/**", "requirements.txt", ".github/workflows/console.yml"]

permissions:
  contents: read

jobs:
  console:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            services/assistant/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - run: python -m pip install -r services/assistant/requirements.txt ruff
      - run: python -m ruff check services/assistant
      - run: python -m ruff format --check services/assistant
      - run: python -m pytest services/assistant/tests -q
      - run: npm ci
        working-directory: apps/console
      - run: npm run format:check
        working-directory: apps/console
      - run: npm run build
        working-directory: apps/console
      - run: npx playwright install --with-deps chromium
        working-directory: apps/console
      - run: npm test
        working-directory: apps/console
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: console-browser-failure
          path: apps/console/test-results/
          retention-days: 7
