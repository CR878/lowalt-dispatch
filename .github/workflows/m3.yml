name: Test suite (M2 + M3)

on:
  push:
    paths: ["agent/**", "validator/**", "planner/**", "sim/**", "core/**", "eval/**", "scenarios/**", "tests/**", "requirements.txt", "pyproject.toml", ".github/workflows/m3.yml"]
  pull_request:
    paths: ["agent/**", "validator/**", "planner/**", "sim/**", "core/**", "eval/**", "scenarios/**", "tests/**", "requirements.txt", "pyproject.toml", ".github/workflows/m3.yml"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt ruff
      - run: python -m pytest
      - run: python -m ruff check agent validator planner sim core tests
      - run: python -m ruff format --check agent validator
      - run: python -m agent.demo --scenario all
      - run: python -m validator
