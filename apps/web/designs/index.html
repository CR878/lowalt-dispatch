<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>界面设计候选 · lowalt-dispatch</title>
<style>
:root{--bg:#0b0d10;--panel:#12151a;--line:#2a2f38;--text:#d9dde3;--dim:#7d8590;--accent:#7fd1bd}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
header{padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{margin:0 0 10px;font-size:15px;font-weight:600;letter-spacing:.5px}
h1 small{font-weight:400;color:var(--dim);font-size:12px;margin-left:10px}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tab{text-align:left;background:#171b21;border:1px solid var(--line);border-radius:8px;
  padding:9px 12px;color:var(--text);cursor:pointer;font-family:inherit;transition:border-color .15s}
.tab:hover{border-color:#5b6570}
.tab.on{border-color:var(--accent);background:#16201f}
.tab b{display:block;font-size:13px;font-weight:600;margin-bottom:3px}
.tab span{display:block;font-size:11px;color:var(--dim);line-height:1.5}
iframe{width:100%;height:100%;border:0;display:block;background:#050a06}
footer{padding:8px 18px;border-top:1px solid var(--line);background:var(--panel);
  font-size:11px;color:var(--dim);display:flex;justify-content:space-between;gap:16px}
footer b{color:var(--accent);font-weight:600}
@media(max-width:760px){.tabs{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>lowalt-dispatch · 界面设计候选<small>三份都是硬编码静态页，零依赖、零后端；数据取自仓库真实定义，数值一律占位</small></h1>
    <div class="tabs">
      <button class="tab on" data-src="a-crt.html">
        <b>A · CRT 纯字符终端</b>
        <span>磷光绿 / 纯 ASCII 栅格 / 扫描线。最极客、最轻，适合录屏开场和截图。</span>
      </button>
      <button class="tab" data-src="b-console.html">
        <b>B · LAB CONSOLE 网格控制台</b>
        <span>冷灰细线 / Canvas 主视图 / 8 个面板。信息密度最高，最像大赛可视化 Demo。</span>
      </button>
      <button class="tab" data-src="c-amber.html">
        <b>C · AMBER TUI 双栏</b>
        <span>琥珀单色 / ASCII 备降余量剖面主视觉。最能一眼讲清项目核心创新。</span>
      </button>
    </div>
  </header>
  <iframe id="view" src="a-crt.html" title="设计预览"></iframe>
  <footer>
    <span>三个文件：<b>apps/web/designs/a-crt.html</b> · <b>b-console.html</b> · <b>c-amber.html</b>（未提交，未改动现有代码）</span>
    <span>选好编号告诉我，我再按你的选择做成正式页面</span>
  </footer>
</div>
<script>
const view=document.getElementById('view');
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    view.src=btn.dataset.src;
  });
});
</script>
</body>
</html>
